# nosh — QUIC-based roaming remote shell (workspace manifest)
[workspace]
resolver = "2"
members = [
    "crates/nosh-proto",
    "crates/nosh-auth",
    "crates/nosh-server",
    "crates/nosh-client",
]
# Exclude the fuzz crate so `cargo test/build --workspace` never touches the
# #[no_main] fuzz binaries (they are nightly-only and break the test runner).
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.74"

# Shared dependency versions — declared once, referenced via `workspace = true`.
[workspace.dependencies]
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
async-trait = "0.1.89"
thiserror = "1"
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }
wtransport = { version = "0.7.1", default-features = false, features = ["self-signed", "ring", "quinn"] }
# Pin time to =0.3.47 — wtransport issue #311 (still open 2026-06-13): time 0.3.48+
# has a breaking change in the dependency graph that causes build failures when
# wtransport is present. Remove this pin when wtransport 0.7.2 closes issue #311.
time = "=0.3.47"

[profile.release]
opt-level = 2
