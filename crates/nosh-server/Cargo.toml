[package]
name = "nosh-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Exposes test-only channel-multiplexing seams (first_active_slot,
# take_server_open_tx, store_server_open_tx, server_open_tx field on SessionSlot)
# to downstream integration tests. Off by default; enabled as a dev-dependency
# feature in nosh-client and any other crate that runs the Phase 21 mux tests.
# These symbols are compiled out of production builds.
test-support = []
# Gates the WebTransport endpoint (wtransport 0.7.1) behind an opt-in Cargo
# feature. Off by default — native QUIC mode is unchanged. Enable with
# --features nosh-server/webtransport. Requires UDP/443 binding (root or
# setcap CAP_NET_BIND_SERVICE); use --port 4433 for dev/CI.
webtransport = ["dep:wtransport"]

[lib]
name = "nosh_server"
path = "src/lib.rs"

[[bin]]
name = "nosh-server"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
nosh-proto = { path = "../nosh-proto" }
nosh-auth = { path = "../nosh-auth" }
quinn = { workspace = true }
rustls = { workspace = true }
rcgen = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }
ssh-key = { version = "0.6", default-features = false, features = ["ed25519", "std", "alloc"] }
dirs = "5"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.29", default-features = false, features = ["signal", "user", "poll", "fs"] }
# Phase 16 (D-16-01c / CR-03 re-mitigation): vte "std" re-enabled so that OSC
# accumulation uses an unbounded Vec<u8> capable of holding large OSC 52 clipboard
# payloads without truncation. CR-03's DoS risk (unbounded OSC accumulation) is
# re-mitigated by explicit caps applied in osc_dispatch() BEFORE storing:
#   - OSC 52 data truncated to OSC_52_MAX_BYTES (65536) before storing in osc52_pending
#   - OSC 0/2 title only stored when len <= MAX_TITLE_BYTES (1024)
# WARNING (999.1 review): the Phase-16 claim that vte's internal OSC buffer is
# "bounded by POSIX pipe semantics before osc_dispatch()" is INCORRECT. With the
# "std" feature, vte's osc_raw is an unbounded Vec<u8> (vte-0.15.0/src/lib.rs:63),
# and it accumulates OSC bytes ACROSS advance()/read calls until the terminator —
# the pipe buffer bounds a single read, not the accumulated buffer. The
# osc_dispatch() caps (OSC_52_MAX_BYTES / MAX_TITLE_BYTES) only limit what is
# STORED, not what vte ALLOCATES while parsing. A long OSC in PTY output can OOM
# the server terminal model (post-auth DoS). Tracked + fix in phase 999.7
# (bound OSC accumulation before vte). See docs/999.1-SECURITY.md §7 (OSC-OOM).
vte = { version = "0.15" }
unicode-width = "0.2"
# Optional wtransport dep — only compiled when webtransport feature is enabled.
wtransport = { workspace = true, optional = true }
