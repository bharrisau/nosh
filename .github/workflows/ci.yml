name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linux:
    name: cargo test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked -- -D warnings

  build-windows:
    name: cargo build nosh-client (Windows MSVC, HARDEN-02)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows client
        # Only nosh-client: nosh-server has portable-pty + nix (Unix-only).
        # nosh-auth is built transitively as a dep of nosh-client.
        #
        # windows-latest (Windows Server 2022) has MSVC Build Tools pre-installed;
        # no MinGW or apt-get step needed.
        #
        # ring 0.17.x ships precompiled x86_64-windows asm objects; no NASM needed
        # for MSVC (contrast with the retired windows-cross.yml GNU path).
        #
        # cargo build (NOT cargo check) is intentional (D-16-04): a real build
        # catches linker and ABI issues that cargo check cannot detect. The job
        # fails the run on any compile error — this is the "not false-green"
        # requirement for HARDEN-02.
        #
        # D-16-04b: The green Actions run confirming HARDEN-02 is satisfied is a
        # HUMAN verification item. The user must push to GitHub and confirm both
        # jobs (linux + build-windows) are green in the Actions tab. This cannot
        # be machine-verified from the build sandbox.
        run: cargo build --locked --target x86_64-pc-windows-msvc -p nosh-client

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1
        name: Audit Rust dependencies
        with:
          # RUSTSEC-2023-0071 — "Marvin Attack" timing sidechannel in the `rsa`
          # crate (no fixed upgrade available). Pulled in TRANSITIVELY via
          # `ssh-key` for PARSING RSA keys only. nosh's own identity/host keys are
          # Ed25519, and it performs NO in-process RSA private-key operations (the
          # vulnerable decrypt/sign timing path) — any RSA signing happens
          # out-of-process in ssh-agent. Accepted residual; see docs/999.1-SECURITY.md.
          # NOTE (operator): re-confirm this acceptance when ssh-key/rsa versions move.
          ignore: RUSTSEC-2023-0071

  osc-bound-regression:
    name: OSC-OOM regression gate (SEC-05)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # This gate exists so that any future change to TerminalState::advance
      # re-runs the bound test. The client has no vte parser today (the OSC
      # bound lives solely server-side in nosh-server). If a client-side vte
      # parser is ever added (e.g., for inline scrollback rendering), an
      # equivalent client gate must be added.
      - name: OSC-OOM regression gate (SEC-05)
        run: cargo test --locked -p nosh-server oversized_multi_chunk_osc_is_bounded_then_resyncs
